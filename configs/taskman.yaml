apiVersion: monitoring.coreos.com/v1alpha1
kind: AlertmanagerConfig
metadata:
  annotations: {}
  labels:
    managed-by: alertmanager-configs
  name: alerts-taskman
  namespace: taskman
spec:
  receivers:
    - name: 'null'
    - name: matrix-high
      webhookConfigs:
        - sendResolved: true
          urlSecret:
            key: url
            name: matrix-webhook-url
  route:
    groupInterval: 1m
    groupWait: 10s
    receiver: 'null'
    routes:
      - continue: false
        matchers:
          - matchType: '='
            name: alertname
            value: InfoInhibitor
        receiver: 'null'
      - continue: false
        matchers:
          - name: alertname
            value: KubePersistentVolumeFillingUp
        receiver: 'null'
      - continue: false
        matchers:
          - matchType: '='
            name: severity
            value: info
        receiver: 'null'
      - continue: false
        groupBy:
          - alertname
          - namespace
          - pod
        matchers:
          - matchType: '='
            name: severity
            value: critical
        receiver: matrix-high
        repeatInterval: 1h
      - continue: false
        groupBy:
          - alertname
          - namespace
        matchers:
          - matchType: '='
            name: severity
            value: warning
        receiver: matrix-high
        repeatInterval: 8h
